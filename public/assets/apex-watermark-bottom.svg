<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" fill="none">
  <defs>
    <linearGradient id="metalBtm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#b0b8c5" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="shadowBtm" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Drop shadow line -->
  <text x="50%" y="62%" dominant-baseline="central" text-anchor="middle"
        font-family="'Poppins', 'Montserrat', 'Segoe UI', sans-serif"
        font-weight="800"
        font-size="220"
        letter-spacing="20"
        fill="none"
        stroke="#000000"
        stroke-opacity="0.55"
        stroke-width="3"
        stroke-linejoin="round">APEX</text>
  <!-- Metallic stroke -->
  <text x="50%" y="60%" dominant-baseline="central" text-anchor="middle"
        font-family="'Poppins', 'Montserrat', 'Segoe UI', sans-serif"
        font-weight="800"
        font-size="220"
        letter-spacing="20"
        fill="none"
        stroke="url(#metalBtm)"
        stroke-width="2"
        stroke-linejoin="round"
        filter="url(#shadowBtm)">APEX</text>
</svg>
