<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" fill="none">
  <defs>
    <linearGradient id="metalTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#9aa2b1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Shadow offset layer -->
  <text x="50%" y="60%" dominant-baseline="central" text-anchor="middle"
        font-family="'Poppins', 'Montserrat', 'Segoe UI', sans-serif"
        font-weight="800"
        font-size="210"
        letter-spacing="18"
        fill="none"
        stroke="#000000"
        stroke-opacity="0.5"
        stroke-width="3"
        stroke-linejoin="round">APEX</text>
  <!-- Main metallic outlined stroke -->
  <text x="50%" y="58%" dominant-baseline="central" text-anchor="middle"
        font-family="'Poppins', 'Montserrat', 'Segoe UI', sans-serif"
        font-weight="800"
        font-size="210"
        letter-spacing="18"
        fill="none"
        stroke="url(#metalTop)"
        stroke-width="1.8"
        stroke-linejoin="round"
        filter="url(#glow)">APEX</text>
</svg>
