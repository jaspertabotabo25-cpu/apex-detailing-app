services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: apex_php
    restart: unless-stopped
    volumes:
      - ./:/var/www/symfony:rw
      - symfony_var:/var/www/symfony/var
    environment:
      DATABASE_URL: "mysql://apex_user:apex_secret@database:3306/apex_detailing?serverVersion=8.0&charset=utf8mb4"
      APP_ENV: dev
      APP_SECRET: 3d500c5bc69b3ee384a8964d422ca458
      DEFAULT_URI: "http://localhost:8080"
    depends_on:
      database:
        condition: service_healthy

  web:
    image: nginx:alpine
    container_name: apex_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/symfony:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  database:
    image: mysql:8.0
    container_name: apex_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: apex_detailing
      MYSQL_USER: apex_user
      MYSQL_PASSWORD: apex_secret
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  symfony_var:
